<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - Exam Management System</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <img src="assets/images/logo.jpeg" alt="Logo">
                </div>
                <h1>Exam Management System</h1>
                <p>Automated Seating, Invigilation &amp; Attendance</p>
            </div>

            <div id="loginAlert" class="alert alert-error" id="loginAlert" style="display:none;"></div>

            <!-- Direct POST to PHP — no JS fetch, no JS redirect, no cache issues -->
            <form id="loginForm" method="POST" action="api/login.php">
                <div class="form-group">
                    <label for="username">Username / Roll Number</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="form-group">
                    <label for="role">Login As</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="admin">Admin</option>
                        <option value="faculty">Faculty</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Login</button>
            </form>

            <div class="login-footer">
                <p>Default Admin: <strong>admin</strong> / <strong>admin123</strong></p>
                <p>Demo Faculty: <strong>rakesh.kumar@gbu.ac.in</strong> / <strong>123</strong></p>
                <p>Demo Student: <strong>235UCS014@gbu.ac.in</strong> / <strong>123</strong></p>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
    <script>
        // Show error from PHP redirect if present
        (function() {
            var params = new URLSearchParams(window.location.search);
            var err = params.get('error');
            if (err) {
                var el = document.getElementById('loginAlert');
                el.textContent = decodeURIComponent(err);
                el.style.display = 'block';
                // Clean the URL without reloading
                history.replaceState(null, '', window.location.pathname);
            }
        })();
    </script>
</body>
</html>
