<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>My Profile | Faculty Portal</title>
<link rel="stylesheet" href="../assets/css/style.css?v=2">
<style>
:root {
  --fp-primary: #2563eb;
  --fp-primary-light: #eff6ff;
  --fp-bg: #f1f5f9;
  --fp-card: #ffffff;
  --fp-border: #e2e8f0;
  --fp-text: #1e293b;
  --fp-muted: #64748b;
  --fp-radius: 12px;
  --fp-shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.06);
}
body { background: var(--fp-bg); color: var(--fp-text); }

.fp-card {
  background: var(--fp-card);
  border-radius: var(--fp-radius);
  box-shadow: var(--fp-shadow);
  overflow: hidden;
  margin-bottom: 20px;
}
.fp-card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--fp-border);
}
.fp-card-header h3 { font-size: 14px; font-weight: 600; color: var(--fp-text); margin: 0; }
.fp-card-body { padding: 20px; }

.profile-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}

/* Profile avatar strip */
.profile-strip {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #0ea5e9 100%);
  border-radius: var(--fp-radius);
  padding: 24px 28px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 24px rgba(37,99,235,0.18);
}
.profile-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.profile-strip h2 { margin: 0 0 4px; font-size: 20px; }
.profile-strip p  { margin: 0; font-size: 13px; opacity: 0.85; }

.sidebar .nav-links a.active {
  background: linear-gradient(90deg, rgba(37,99,235,0.28) 0%, rgba(37,99,235,0.10) 100%);
  color: #fff;
  border-left-color: #60a5fa;
  font-weight: 600;
}
/* ── Force sidebar nav into strict vertical source order ── */
.sidebar .nav-links {
  display: flex !important;
  flex-direction: column !important;
  flex-wrap: nowrap !important;
}
.sidebar .nav-links a,
.sidebar .nav-links hr {
  order: unset !important;
  float: none !important;
  position: static !important;
}

@media (max-width: 900px) {
  .profile-layout { grid-template-columns: 1fr; }
  .profile-strip  { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>
<div class="app-wrapper">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Exam System</h2>
      <p id="user-label">Loading...</p>
    </div>
    <nav class="nav-links" data-nav="faculty">
      <a href="faculty_portal.html"><i>&#128197;</i> My Duties</a>
      <a href="faculty_attendance.html"><i>&#9989;</i> Digital Attendance</a>
      <a href="faculty_replacement.html"><i>&#128260;</i> Replacement Requests</a>
      <a href="faculty_profile.html" class="active"><i>&#128100;</i> My Profile</a>
      <hr>
      <a href="#" onclick="doLogout(); return false;"><i>&#128682;</i> Logout</a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('collapsed')" aria-label="Toggle sidebar">&#9776;</button>
      <h1>My Profile</h1>
    </header>

    <div class="page-body">

      <!-- Profile strip -->
      <div class="profile-strip">
        <div class="profile-avatar">&#128100;</div>
        <div>
          <h2 id="strip-name">Loading...</h2>
          <p id="strip-meta">—</p>
        </div>
      </div>

      <div class="profile-layout">

        <!-- Edit profile -->
        <div class="fp-card">
          <div class="fp-card-header"><h3>Edit Profile</h3></div>
          <div class="fp-card-body">
            <form onsubmit="saveProfile(event)">
              <div class="form-group">
                <label for="prof-username">Username (read-only)</label>
                <input type="text" id="prof-username" class="form-control" disabled>
              </div>
              <div class="form-group">
                <label for="prof-dept">Department (read-only)</label>
                <input type="text" id="prof-dept" class="form-control" disabled>
              </div>
              <div class="form-group">
                <label for="prof-name">Full Name</label>
                <input type="text" id="prof-name" class="form-control" required placeholder="Your full name">
              </div>
              <div class="form-group">
                <label for="prof-email">Email</label>
                <input type="email" id="prof-email" class="form-control" required placeholder="your@email.com">
              </div>
              <div class="form-group">
                <label for="prof-mobile">Mobile</label>
                <input type="text" id="prof-mobile" class="form-control" placeholder="10-digit mobile number">
              </div>
              <div class="form-group">
                <label for="prof-qualification">Qualification</label>
                <input type="text" id="prof-qualification" class="form-control" placeholder="e.g. M.Tech, Ph.D">
              </div>
              <button type="submit" class="btn btn-primary btn-full">Update Profile</button>
            </form>
          </div>
        </div>

        <!-- Change password -->
        <div class="fp-card">
          <div class="fp-card-header"><h3>Change Password</h3></div>
          <div class="fp-card-body">
            <form onsubmit="changePassword(event)">
              <div class="form-group">
                <label for="pwd-old">Current Password</label>
                <input type="password" id="pwd-old" class="form-control" required placeholder="Enter current password">
              </div>
              <div class="form-group">
                <label for="pwd-new">New Password</label>
                <input type="password" id="pwd-new" class="form-control" required placeholder="Min. 6 characters">
              </div>
              <div class="form-group">
                <label for="pwd-confirm">Confirm New Password</label>
                <input type="password" id="pwd-confirm" class="form-control" required placeholder="Repeat new password">
              </div>
              <button type="submit" class="btn btn-primary btn-full">Change Password</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="../assets/js/script.js"></script>
<script>
async function doLogout() {
  await fetch('../api/auth.php', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'logout'}) });
  window.location.href = '../index.html';
}

// ── Load profile ──────────────────────────────────────────────
async function loadProfile() {
  try {
    var res  = await fetch('../api/faculty-portal.php?action=get_profile');
    var data = await res.json();
    if (!data.success || !data.data) { showToast('Failed to load profile.', 'error'); return; }
    var p = data.data;
    document.getElementById('prof-username').value      = p.username      || '';
    document.getElementById('prof-dept').value          = p.department    || '';
    document.getElementById('prof-name').value          = p.name          || '';
    document.getElementById('prof-email').value         = p.email         || '';
    document.getElementById('prof-mobile').value        = p.mobile        || '';
    document.getElementById('prof-qualification').value = p.qualification || '';
    // Update strip
    document.getElementById('strip-name').textContent = p.name || p.username || 'Faculty';
    document.getElementById('strip-meta').textContent =
      [p.department, p.designation, p.email].filter(Boolean).join(' · ') || '—';
  } catch(e) {
    showToast('Error loading profile.', 'error');
  }
}

// ── Save profile ──────────────────────────────────────────────
async function saveProfile(event) {
  event.preventDefault();
  var name          = document.getElementById('prof-name').value.trim();
  var email         = document.getElementById('prof-email').value.trim();
  var mobile        = document.getElementById('prof-mobile').value.trim();
  var qualification = document.getElementById('prof-qualification').value.trim();
  if (!name || !email) { showToast('Name and email are required.', 'warning'); return; }
  try {
    var res  = await fetch('../api/faculty-portal.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action:'update_profile', name:name, email:email, mobile:mobile, qualification:qualification })
    });
    var data = await res.json();
    showToast(data.message || (data.success ? 'Profile updated!' : 'Failed.'), data.success ? 'success' : 'error');
    if (data.success) loadProfile();
  } catch(e) {
    showToast('Error updating profile.', 'error');
  }
}

// ── Change password ───────────────────────────────────────────
async function changePassword(event) {
  event.preventDefault();
  var oldPwd  = document.getElementById('pwd-old').value;
  var newPwd  = document.getElementById('pwd-new').value;
  var confPwd = document.getElementById('pwd-confirm').value;
  if (!oldPwd || !newPwd || !confPwd) { showToast('All fields are required.', 'warning'); return; }
  if (newPwd !== confPwd)             { showToast('New passwords do not match.', 'error'); return; }
  if (newPwd.length < 6)             { showToast('Password must be at least 6 characters.', 'warning'); return; }
  try {
    var res  = await fetch('../api/faculty-portal.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action:'change_password', old_password:oldPwd, new_password:newPwd, confirm_password:confPwd })
    });
    var data = await res.json();
    showToast(data.message || (data.success ? 'Password changed!' : 'Failed.'), data.success ? 'success' : 'error');
    if (data.success) {
      document.getElementById('pwd-old').value = '';
      document.getElementById('pwd-new').value = '';
      document.getElementById('pwd-confirm').value = '';
    }
  } catch(e) {
    showToast('Error changing password.', 'error');
  }
}

// ── Bootstrap ─────────────────────────────────────────────────
(async function() {
  try {
    var res  = await fetch('../api/auth.php?action=check');
    var auth = await res.json();
    if (!auth.logged_in || auth.role !== 'faculty') {
      window.location.href = '../index.html'; return;
    }
    document.getElementById('user-label').textContent = auth.username + ' (Faculty)';
    await loadProfile();
  } catch(e) {
    window.location.href = '../index.html';
  }
})();
</script>
</body>
</html>
